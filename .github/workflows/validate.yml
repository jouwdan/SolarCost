name: Validate
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
jobs:
  accounting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: pip install ruff==0.16.6
      - run: ruff check . && ruff format --check .
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node tests/test_card.mjs
      - name: Build installable integration
        run: git archive --format=zip --output=solarcost.zip --add-file=LICENSE HEAD:custom_components/solarcost
      - name: Check release archive
        run: python tests/check_release.py solarcost.zip
      - uses: actions/upload-artifact@v7
        with:
          name: solarcost-integration
          path: solarcost.zip
          if-no-files-found: error
          retention-days: 7
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: >-
          docker run --rm -v "$PWD:/work:ro" -w /work --entrypoint python
          ghcr.io/home-assistant/home-assistant:2026.9.0 tests/ha_smoke.py
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        env:
          # Validate this revision even during a manual release or scheduled run.
          REPOSITORY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          category: integration
          comment: false
